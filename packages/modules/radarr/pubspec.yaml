name: radarr
description: Radarr service module for arr-client.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  # The module contract, and the request allow-list harness the tests use.
  core:
    path: ../../core
  flutter:
    sdk: flutter
  # Translations of the Flutter widgets; imported by the generated localizations.
  flutter_localizations:
    sdk: flutter
  # Imported by the generated localizations.
  intl: ^0.20.2
  # The reads the Servarr family has in common: queue, history and options.
  servarr:
    path: ../../servarr

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # `flutter pub get` runs gen-l10n with l10n.yaml.
  generate: true
