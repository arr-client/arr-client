name: lidarr
description: Lidarr service module for arr-client.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  # The module contract; its tests also use core/testing/allow_list.dart.
  core:
    path: ../../core
  flutter:
    sdk: flutter
  # Translations of the Flutter widgets; imported by the generated localizations.
  flutter_localizations:
    sdk: flutter
  # State of the module's screens (docs/standards/patterns.md). MIT.
  flutter_riverpod: ^3.5.0
  # Moves between the module's own screens, by the routes the app registers
  # for them. The app routes with it too. BSD-3-Clause.
  go_router: ^18.1.4
  # Imported by the generated localizations, and formats numbers. BSD-3-Clause.
  intl: ^0.20.2
  # Material widgets. package:flutter/material.dart is deprecated.
  material_ui: ^1.11.1
  # The client of the API the Servarr family shares.
  servarr:
    path: ../../servarr
  # Theme, shared widgets and formatting of screens.
  ui:
    path: ../../ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # `flutter pub get` runs gen-l10n with l10n.yaml.
  generate: true
