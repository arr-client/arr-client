name: arr_client_workspace
publish_to: none

environment:
  sdk: ^3.14.0
  # Exact version, matching .fvmrc. CI installs the version read from here.
  flutter: 3.50.1

workspace:
  - apps/arr_client
  - packages/core
  - packages/modules/bazarr
  - packages/modules/lidarr
  - packages/modules/prowlarr
  - packages/modules/qbittorrent
  - packages/modules/radarr
  - packages/modules/readarr
  - packages/modules/seerr
  - packages/modules/sonarr
  - packages/platform_local_network
  - packages/servarr
  - packages/ui

dev_dependencies:
  # tool/check_dependencies.dart parses Dart directives with it.
  analyzer: ^14.7.0
  # tool/check_licenses.dart recognises long licence texts by their SHA-256.
  crypto: ^3.0.7
  # The root analysis_options.yaml includes it.
  flutter_lints: ^6.0.0
  # Runs the tests of the repository tools in tool/test/.
  test: ^1.31.0
  # The repository tools read pubspec files and pubspec.lock with it.
  yaml: ^3.1.3
