name: Publish wiki
# The wiki is edited through pull requests to docs/wiki/.
# GitHub creates the wiki repository only after a first page is saved in the web UI.
on:
  push:
    branches: [main]
    paths: [docs/wiki/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Copy pages to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config --global http.extraheader "AUTHORIZATION: basic $auth"
          git clone "https://github.com/$GITHUB_REPOSITORY.wiki.git" "$RUNNER_TEMP/wiki"
          rm -f "$RUNNER_TEMP"/wiki/*.md
          cp docs/wiki/*.md "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Update wiki from $GITHUB_SHA"; git push; }
