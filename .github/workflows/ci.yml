name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run. Runs on main finish, so that they save the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check repository files
        run: python3 .github/scripts/check_repo.py
  analyze-test:
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.project.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: project
        run: |
          if [ -d apps/arr_client/integration_test ]; then echo "integration=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/setup-flutter
      - run: |
          flutter pub get
          bash .github/scripts/codegen.sh
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          for dir in apps/* packages/* packages/modules/*; do
            # flutter test fails on a test directory that holds no tests.
            if [ -n "$(find "$dir/test" -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
              (cd "$dir" && flutter test)
            fi
          done
          dart test tool/test
          dart run tool/check_dependencies.dart
          dart run tool/check_licenses.dart
          dart run tool/check_sqlite_source.dart
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On a pull request, the merge commit and its parents, to list what changed.
          fetch-depth: 2
          persist-credentials: false
      # A pull request that touches only documents builds no APK. Pushes to main always build.
      # The steps are skipped, not the job, so the required check still gets a result.
      - id: changes
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The first parent of the merge commit is the base branch.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            if [ -n "$files" ] && ! grep -qvE '^(docs/|specs/|[^/]+\.md$)' <<< "$files"; then
              build=false
              echo "Only documents changed; not building the APK."
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - id: setup
        if: steps.changes.outputs.build == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          gradle: true
      - if: steps.changes.outputs.build == 'true'
        run: |
          mkdir -p ~/.gradle
          # Reuse task outputs between runs, and leave no daemon writing while the cache is saved.
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\n' >> ~/.gradle/gradle.properties
          flutter pub get
          bash .github/scripts/codegen.sh
      - if: steps.changes.outputs.build == 'true'
        run: cd apps/arr_client && flutter build apk --debug
      # Reads what the build hooks of the build above did.
      - if: steps.changes.outputs.build == 'true'
        name: Check that SQLite was compiled from source, not downloaded
        run: dart run tool/check_sqlite_source.dart --built=android
      # Caches are saved only by the steps below, and only from main.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.flutter-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.flutter-path }}
          key: ${{ steps.setup.outputs.flutter-key }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.pub-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.pub-path }}
          key: ${{ steps.setup.outputs.pub-key }}
      # The wrapper needs only the unpacked distribution, not the archive it came from.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.gradle-hit != 'true'
        run: find ~/.gradle/wrapper/dists -name '*.zip' -delete
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.gradle-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.setup.outputs.gradle-key }}
  # The required check. It must run even when a job it needs failed or was cancelled: GitHub counts
  # a skipped required check as passed.
  flutter:
    needs: [analyze-test, apk]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          ANALYZE_TEST: ${{ needs.analyze-test.result }}
          APK: ${{ needs.apk.result }}
        run: |
          echo "analyze-test: $ANALYZE_TEST, apk: $APK"
          test "$ANALYZE_TEST" = success
          test "$APK" = success
  integration:
    needs: analyze-test
    if: needs.analyze-test.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          gradle: true
      - run: |
          flutter pub get
          bash .github/scripts/codegen.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          # One file per run: in a single run the files after the first fail to start the Dart
          # Development Service. The action runs each line of a script in its own shell.
          script: cd apps/arr_client && files=$(find integration_test -name '*_test.dart' | sort) && test -n "$files" && for file in $files; do flutter test "$file" || exit 1; done
