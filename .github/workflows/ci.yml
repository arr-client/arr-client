name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run. Runs on main finish, so that they save the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check repository files
        run: python3 .github/scripts/check_repo.py
  # In two shards that run side by side. "app" also holds the checks that run once for the whole
  # repository. Together they test every directory under apps/ and packages/.
  analyze-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [app, packages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # On a pull request, the merge commit and its parents, to list what changed.
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-flutter
      - if: steps.changes.outputs.code == 'true'
        name: Fetch dependencies and generate code
        run: |
          flutter pub get
          bash .github/scripts/codegen.sh
      - if: steps.changes.outputs.code == 'true' && matrix.shard == 'app'
        name: Check formatting and analyze
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
      - if: steps.changes.outputs.code == 'true' && matrix.shard == 'app'
        name: Test the repository tools and check dependencies, licences and SQLite
        run: |
          dart test tool/test
          dart run tool/check_dependencies.dart
          dart run tool/check_licenses.dart
          dart run tool/check_sqlite_source.dart
      - if: steps.changes.outputs.code == 'true'
        name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            app) dirs=(apps/*) ;;
            packages) dirs=(packages/* packages/modules/*) ;;
          esac
          for dir in "${dirs[@]}"; do
            # flutter test fails on a test directory that holds no tests.
            if [ -n "$(find "$dir/test" -name '*_test.dart' -print -quit 2>/dev/null)" ]; then
              echo "$dir"
              # By default flutter test leaves some of the runner's cores idle.
              (cd "$dir" && flutter test --concurrency="$(nproc)")
            fi
          done
      # The runner is in UTC, where a local day and a UTC day are the same: a mix-up of the two in
      # the calendar or in what was downloaded today only fails in a zone away from it.
      - if: steps.changes.outputs.code == 'true'
        name: Test calendar days and imports east and west of UTC
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            app) dirs=(apps/arr_client) ;;
            packages) dirs=(packages/servarr packages/modules/*) ;;
          esac
          ran=0
          for dir in "${dirs[@]}"; do
            if [ ! -d "$dir/test" ]; then continue; fi
            files=$(cd "$dir" && find test -name '*calendar*_test.dart' -o -name '*import*_test.dart' | sort)
            if [ -z "$files" ]; then continue; fi
            for zone in Pacific/Auckland America/New_York; do
              echo "$dir in $zone"
              # shellcheck disable=SC2086 # One argument for each file; none has a space.
              (cd "$dir" && TZ="$zone" flutter test --concurrency="$(nproc)" $files)
            done
            ran=1
          done
          # Renamed tests must not leave this step passing with nothing run.
          test "$ran" = 1
  # The debug and the release build run side by side. The release one saves the caches on main.
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
      - id: setup
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          gradle: true
      # Start a new Gradle cache with an empty build cache, so that it holds only what this build
      # uses and does not grow with every save.
      - if: matrix.mode == 'release' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.gradle-hit != 'true'
        run: rm -rf ~/.gradle/caches/build-cache-1
      - if: steps.changes.outputs.code == 'true'
        name: Fetch dependencies and generate code
        run: |
          mkdir -p ~/.gradle
          # Reuse task outputs between runs, and leave no daemon writing while the cache is saved.
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\n' >> ~/.gradle/gradle.properties
          flutter pub get
          bash .github/scripts/codegen.sh --no-test-helpers
      - if: steps.changes.outputs.code == 'true' && matrix.mode == 'debug'
        run: cd apps/arr_client && flutter build apk --debug
      # Only a release build compiles Dart ahead of time, which can fail on code that a debug
      # build and the tests accept. Built as release.yml builds, but unsigned.
      - if: steps.changes.outputs.code == 'true' && matrix.mode == 'release'
        name: Check that the release build compiles
        run: cd apps/arr_client && flutter build apk --release --split-per-abi
      # Reads what the build hooks of the build above did.
      - if: steps.changes.outputs.code == 'true'
        name: Check that SQLite was compiled from source, not downloaded
        run: dart run tool/check_sqlite_source.dart --built=android
      # The cache about to be saved has no transforms, and pull requests build debug from it too.
      # This puts what a debug build needs into the build cache.
      - if: matrix.mode == 'release' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.gradle-hit != 'true'
        name: Build debug as well, for the Gradle cache
        run: cd apps/arr_client && flutter build apk --debug
      # Caches are saved only by the steps below, and only from main.
      - if: matrix.mode == 'release' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.flutter-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.flutter-path }}
          key: ${{ steps.setup.outputs.flutter-key }}
      - if: matrix.mode == 'release' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.pub-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.pub-path }}
          key: ${{ steps.setup.outputs.pub-key }}
      # The wrapper needs only the unpacked distribution, not the archive it came from. Transforms
      # are a large part of the cache, and a build without them is no slower: Gradle makes them
      # again, or takes them from the build cache.
      - if: matrix.mode == 'release' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.gradle-hit != 'true'
        run: |
          find ~/.gradle/wrapper/dists -name '*.zip' -delete
          rm -rf ~/.gradle/caches/*/transforms
      - if: matrix.mode == 'release' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.gradle-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.setup.outputs.gradle-key }}
  # The required check. It must run even when a job it needs failed or was cancelled: GitHub counts
  # a skipped required check as passed.
  flutter:
    needs: [analyze-test, apk]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          ANALYZE_TEST: ${{ needs.analyze-test.result }}
          APK: ${{ needs.apk.result }}
        run: |
          echo "analyze-test: $ANALYZE_TEST, apk: $APK"
          test "$ANALYZE_TEST" = success
          test "$APK" = success
  # The app on an emulator, against fake servers that the tests run on the emulator itself.
  # It needs no other job, and waiting for one would only make a pull request slower.
  integration:
    runs-on: ubuntu-latest
    # A hung emulator must not hold the runner for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
      - if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          gradle: true
      - if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p ~/.gradle
          # Reuse the task outputs in the cache that main saves.
          printf 'org.gradle.caching=true\n' >> ~/.gradle/gradle.properties
          flutter pub get
          bash .github/scripts/codegen.sh
      # The long first build is done before the emulator runs beside it.
      - if: steps.changes.outputs.code == 'true'
        run: cd apps/arr_client && flutter build apk --debug --target-platform android-x64
      - if: steps.changes.outputs.code == 'true'
        name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - if: steps.changes.outputs.code == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          # A phone's screen; the default one is far smaller.
          profile: pixel_6
          # One file per run: in a single run the files after the first fail to start the Dart
          # Development Service. The action runs each line of a script in its own shell.
          script: cd apps/arr_client && files=$(find integration_test -name '*_test.dart' | sort) && test -n "$files" && for file in $files; do flutter test "$file" || exit 1; done
