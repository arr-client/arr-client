name: Release
# Before tagging vX.Y.Z, set "version: X.Y.Z+N" in apps/arr_client/pubspec.yaml with a higher N.
# Pre-releases use X.Y.Z-beta.1+N and tag vX.Y.Z-beta.1.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the version
        run: python3 .github/scripts/check_version.py "$GITHUB_REF_NAME"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Fetch dependencies and generate code
        run: |
          flutter pub get
          bash .github/scripts/codegen.sh
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Signing secrets are not set."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > apps/arr_client/android/key.properties
      - name: Build
        run: |
          cd apps/arr_client
          flutter build apk --release --split-per-abi
          cd build/app/outputs/flutter-apk
          sha256sum ./*-release.apk > SHA256SUMS
      - name: Check that every APK is signed
        run: |
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          shopt -s nullglob
          apks=(apps/arr_client/build/app/outputs/flutter-apk/*-release.apk)
          test "${#apks[@]}" -gt 0 || { echo "::error::No release APKs found."; exit 1; }
          for apk in "${apks[@]}"; do
            "$apksigner" verify "$apk" || { echo "::error::$apk failed signature verification."; exit 1; }
            echo "Signed: $apk"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apks
          path: |
            apps/arr_client/build/app/outputs/flutter-apk/*-release.apk
            apps/arr_client/build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
  publish:
    # Holds the write token and runs no project code.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" ./*-release.apk SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
