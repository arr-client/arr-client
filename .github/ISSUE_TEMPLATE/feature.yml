name: Feature request
description: Suggest something the app should do
labels: ["type: feature", "status: needs triage"]
body:
  - type: dropdown
    id: service
    attributes:
      label: Service
      options:
        - Sonarr
        - Radarr
        - Lidarr
        - Readarr / Bookshelf
        - Prowlarr
        - Bazarr
        - Seerr
        - qBittorrent
        - The app in general
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Note that server configuration features are out of scope.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
