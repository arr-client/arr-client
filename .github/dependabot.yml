version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite actions of this repository.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    labels: ["type: dependencies", "area: ci"]
  # The root of the pub workspace: one pubspec.lock covers every package.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    labels: ["type: dependencies"]
