changelog:
  exclude:
    labels: ["type: spec"]
  categories:
    - title: New features
      labels: ["type: feature", "type: new service"]
    - title: Fixes
      labels: ["type: bug"]
    - title: Documentation
      labels: ["type: docs"]
    - title: Dependencies
      labels: ["type: dependencies"]
    - title: Other changes
      labels: ["*"]
