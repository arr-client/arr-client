# Stands in for a proxy that puts a browser login in front of a service: every request, whatever
# its method or path, gets 200 and an HTML page instead of data. The form does nothing.
server {
    listen 80;

    location / {
        default_type "text/html; charset=utf-8";
        return 200 '<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<h1>Sign in to continue</h1>
<form method="post" action="/login">
<label>User name <input name="username"></label>
<label>Password <input name="password" type="password"></label>
<button type="submit">Sign in</button>
</form>
</body>
</html>
';
    }
}
