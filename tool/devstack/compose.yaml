# Throwaway servers for manual verification and fixture capture (research R15).
#
#   docker compose -f tool/devstack/compose.yaml up -d
#   tool/devstack/keys.sh                                      # keys, logins, fingerprint
#   docker compose -f tool/devstack/compose.yaml down          # stop, keep data
#   docker compose -f tool/devstack/compose.yaml down -v       # stop and delete everything
#
# Add `--profile best-effort` (after `-f ...`, on `down` too) for Bookshelf, Overseerr and
# Jellyseerr.
#
# Every port is bound to 127.0.0.1. An Android emulator reaches it as 10.0.2.2; for a physical
# device use `adb reverse tcp:PORT tcp:PORT`. If a port is taken, set the matching variable, for
# example QBITTORRENT_PORT=18080, and keep it set for later compose and keys.sh commands.
#
#   Sonarr 8989      Radarr 7878       Lidarr 8686       Readarr 8787     Prowlarr 9696
#   Bazarr 6767      Seerr 5055        qBittorrent 8080  Jellyfin 8096
#   Bookshelf 8788   Overseerr 5056    Jellyseerr 5057
#   8443  HTTPS with a self-signed certificate: `/` is Radarr, and /sonarr/, /radarr/, /lidarr/,
#         /readarr/, /prowlarr/, /bazarr/, /seerr/ and /qbittorrent/ reach each service
#   8081  answers every request with an HTML login page
#
# Setup done by hand in each web UI, only as far as a test needs it:
#   - Root folders: /data/movies, /data/tv, /data/music, /data/books.
#   - Seerr, Overseerr and Jellyseerr answer only public requests until set up, and setup needs a
#     media server (Overseerr: Plex only). Others: do Jellyfin's wizard, use http://jellyfin:8096.
#     Inside the stack, services reach each other by name (http://radarr:7878).
#
# The stack adds no indexers and downloads no media, so queue items, imports and release search
# results do not appear by themselves.

name: arr-client-devstack

x-linuxserver: &linuxserver
  PUID: "1000"
  PGID: "1000"
  TZ: Etc/UTC

services:
  # Makes the shared media folders writable for the services' user. Runs once and exits.
  media-init:
    image: docker.io/library/nginx:1.31.10
    entrypoint:
      - sh
      - -c
      - >-
        cd /data && mkdir -p movies tv music books downloads &&
        chown 1000:1000 . movies tv music books downloads
    volumes:
      - media:/data

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329
    environment: *linuxserver
    ports: ["127.0.0.1:${SONARR_PORT:-8989}:8989"]
    volumes:
      - sonarr-config:/config
      - media:/data

  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    environment: *linuxserver
    ports: ["127.0.0.1:${RADARR_PORT:-7878}:7878"]
    volumes:
      - radarr-config:/config
      - media:/data

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.6.5079-ls50
    environment: *linuxserver
    ports: ["127.0.0.1:${LIDARR_PORT:-8686}:8686"]
    volumes:
      - lidarr-config:/config
      - media:/data

  # Upstream is retired; this is the last linuxserver.io build of 0.4.
  readarr:
    image: lscr.io/linuxserver/readarr:develop-0.4.18.2805-ls157
    environment: *linuxserver
    ports: ["127.0.0.1:${READARR_PORT:-8787}:8787"]
    volumes:
      - readarr-config:/config
      - media:/data

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.1.0.5799-ls170
    environment: *linuxserver
    ports: ["127.0.0.1:${PROWLARR_PORT:-9696}:9696"]
    volumes:
      - prowlarr-config:/config

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls374
    environment: *linuxserver
    ports: ["127.0.0.1:${BAZARR_PORT:-6767}:6767"]
    volumes:
      - bazarr-config:/config
      - media:/data

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    init: true
    environment:
      TZ: Etc/UTC
    ports: ["127.0.0.1:${SEERR_PORT:-5055}:5055"]
    volumes:
      - seerr-config:/app/config

  # Not a service the app supports: Seerr needs a media server to finish its setup.
  jellyfin:
    image: docker.io/jellyfin/jellyfin:10.11.11
    ports: ["127.0.0.1:${JELLYFIN_PORT:-8096}:8096"]
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - media:/data

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.1_v2.1.3-ls490
    environment:
      <<: *linuxserver
      # qBittorrent rejects a Host header whose port differs from the one it listens on, so the
      # port inside the container follows the published one.
      WEBUI_PORT: "${QBITTORRENT_PORT:-8080}"
    ports: ["127.0.0.1:${QBITTORRENT_PORT:-8080}:${QBITTORRENT_PORT:-8080}"]
    volumes:
      - qbittorrent-config:/config
      - media:/data

  https-proxy:
    image: docker.io/library/nginx:1.31.10
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      QBITTORRENT_PORT: "${QBITTORRENT_PORT:-8080}"
    ports: ["127.0.0.1:${HTTPS_PORT:-8443}:443"]
    volumes:
      - ./proxy/make-cert.sh:/docker-entrypoint.d/40-make-cert.sh:ro
      - ./proxy/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certs:/certs

  login-proxy:
    image: docker.io/library/nginx:1.31.10
    ports: ["127.0.0.1:${LOGIN_PORT:-8081}:80"]
    volumes:
      - ./proxy/login.conf:/etc/nginx/conf.d/default.conf:ro

  bookshelf:
    image: ghcr.io/pennydreadful/bookshelf:softcover-v0.4.21.182
    profiles: [best-effort]
    environment: *linuxserver
    ports: ["127.0.0.1:${BOOKSHELF_PORT:-8788}:8787"]
    volumes:
      - bookshelf-config:/config
      - media:/data

  overseerr:
    image: docker.io/sctx/overseerr:1.35.0
    profiles: [best-effort]
    environment:
      TZ: Etc/UTC
    ports: ["127.0.0.1:${OVERSEERR_PORT:-5056}:5055"]
    volumes:
      - overseerr-config:/app/config

  jellyseerr:
    image: docker.io/fallenbagel/jellyseerr:2.7.3
    profiles: [best-effort]
    init: true
    environment:
      TZ: Etc/UTC
    ports: ["127.0.0.1:${JELLYSEERR_PORT:-5057}:5055"]
    volumes:
      - jellyseerr-config:/app/config

volumes:
  media:
  certs:
  sonarr-config:
  radarr-config:
  lidarr-config:
  readarr-config:
  prowlarr-config:
  bazarr-config:
  seerr-config:
  jellyfin-config:
  jellyfin-cache:
  qbittorrent-config:
  bookshelf-config:
  overseerr-config:
  jellyseerr-config:
