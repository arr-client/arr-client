name: arr_client
description: Mobile companion app for self-hosted media services.
publish_to: none
resolution: workspace
# release.yml checks this against the tag.
version: 0.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  # Reads the Android dynamic colour palette. Apache-2.0.
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  # Material widgets. package:flutter/material.dart is deprecated.
  material_ui: ^1.11.1
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
