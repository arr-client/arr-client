name: arr_client
description: Mobile companion app for self-hosted media services.
publish_to: none
resolution: workspace
# release.yml checks this against the tag.
version: 0.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  # Tells which network the device is on (Wi-Fi, mobile data, VPN), which the
  # local network permission and connection state depend on. BSD-3-Clause; on
  # Android it adds only AndroidX core and ACCESS_NETWORK_STATE.
  connectivity_plus: ^7.3.2
  core:
    path: ../../packages/core
  # Reads the Android dynamic colour palette. Apache-2.0.
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  # Material widgets. package:flutter/material.dart is deprecated.
  material_ui: ^1.11.1
  platform_local_network:
    path: ../../packages/platform_local_network
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
