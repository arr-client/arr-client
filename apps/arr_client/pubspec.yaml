name: arr_client
description: Mobile companion app for self-hosted media services.
publish_to: none
resolution: workspace
# release.yml checks this against the tag.
version: 0.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  # Tells which network the device is on (Wi-Fi, mobile data, VPN), which the
  # local network permission and connection state depend on. BSD-3-Clause; on
  # Android it adds only AndroidX core and ACCESS_NETWORK_STATE.
  connectivity_plus: ^7.3.2
  core:
    path: ../../packages/core
  # Opens the file of core's database, in an isolate of its own. MIT.
  drift: ^2.35.4
  # Reads the Android dynamic colour palette. Apache-2.0.
  dynamic_color: ^2.1.0
  # The system's document picker, to import a certificate authority. BSD-3-Clause;
  # its Android side declares only AndroidX annotations, and asks no permission.
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  # Translations of the Flutter widgets; imported by the generated localizations.
  flutter_localizations:
    sdk: flutter
  # Dependency injection and screen state (docs/standards/patterns.md). MIT.
  flutter_riverpod: ^3.5.0
  # Implements core's SecretStore: values encrypted with a key that the Android
  # Keystore protects. BSD-3-Clause; its Android side declares Google Tink
  # (Apache-2.0), not Play services.
  flutter_secure_storage: ^11.2.0
  # Routing, with the instance-scoped routes of contracts/navigation.md.
  # BSD-3-Clause.
  go_router: ^18.1.4
  # Imported by the generated localizations.
  intl: ^0.20.2
  # Material widgets. package:flutter/material.dart is deprecated.
  material_ui: ^1.11.1
  # Where the database and the artwork cache live. BSD-3-Clause.
  path_provider: ^2.1.6
  platform_local_network:
    path: ../../packages/platform_local_network
  qbittorrent:
    path: ../../packages/modules/qbittorrent
  radarr:
    path: ../../packages/modules/radarr
  sonarr:
    path: ../../packages/modules/sonarr
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # `flutter pub get` runs gen-l10n with l10n.yaml.
  generate: true
  uses-material-design: true
